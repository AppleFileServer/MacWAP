# Kannel configuration for macgateway — WAP gateway for the Nokia 7110.
# Installed as /etc/kannel/kannel.conf by install.sh.
#
# The SMS side (modem, smsbox, link to wap-over-sms) lives in
# /etc/kannel/sms.conf, which stays empty until the GSM HAT is fitted.

group = core
admin-port = 13000
admin-password = @ADMIN_PASSWORD@
admin-deny-ip = "*.*.*.*"
admin-allow-ip = "127.0.0.1"
# Enabled by "install.sh enable-sms" (Kannel refuses to start with this
# set and no smsbox group).
#smsbox-port = 13003
wapbox-port = 13002
# WAP over UDP (ports 9200/9201) on this machine only, which is all
# wap-over-sms needs. A data-call (PPP) client would need "*" here, which
# also lets anything on the home network browse through the gateway.
wdp-interface-name = "127.0.0.1"
log-file = "/var/log/kannel/bearerbox.log"
log-level = 1
box-deny-ip = "*.*.*.*"
box-allow-ip = "127.0.0.1"

group = wapbox
bearerbox-host = 127.0.0.1
log-file = "/var/log/kannel/wapbox.log"
log-level = 1
syslog-level = none
# The phone's "Home" and short addresses: http://pi/... is served by
# wapserver.py on this machine.
device-home = "http://127.0.0.1:8088/index.wml"
map-url = "http://pi/* http://127.0.0.1:8088/*"

include = "/etc/kannel/sms.conf"
